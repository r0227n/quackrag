[workspace]
resolver = "2"
members = [
    "crates/quackrag-core",
    "crates/quackrag-embedding",
    "crates/quackrag-llm",
    "crates/quackrag-store",
    "crates/quackrag-ffi",
    "qg",
]
exclude = [
    "examples/quackrag-llm-test",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/r0227n/quackrag"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3"
