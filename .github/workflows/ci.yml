name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, 'feature/**']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # dtolnay/rust-toolchain@stable
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.92.0

      # Swatinem/rust-cache@v2
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          shared-key: check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Check example
        run: cargo check --manifest-path examples/quackrag-llm-test/Cargo.toml --all-targets

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # dtolnay/rust-toolchain@stable
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.92.0

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      # Swatinem/rust-cache@v2
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          workspaces: |
            . -> target
            examples/quackrag-llm-test -> target
          shared-key: ubuntu-build

      - name: Build workspace
        run: cargo build --workspace

      - name: Build example
        run: cargo build --manifest-path examples/quackrag-llm-test/Cargo.toml
